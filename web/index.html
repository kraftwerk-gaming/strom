<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>strom - IPFS game status</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #11191f;
      --fg: #e3e8ec;
      --muted: #8aa0ad;
      --border: #2a3a45;
      --accent: #4a9aff;
      --row: #16222a;
      --row-alt: #182832;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, "JetBrains Mono", "Fira Code", monospace;
    }
    body {
      margin: 0;
      padding: 1.5rem;
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 { margin: 0 0 0.5rem; }
    p, small { color: var(--muted); }
    a { color: var(--accent); }
    button {
      background: var(--accent);
      color: #fff;
      border: 0;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      font-size: 0.9rem;
    }
    th, td {
      padding: 0.5rem 0.6rem;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 600; }
    tbody tr:nth-child(odd) { background: var(--row); }
    tbody tr:nth-child(even) { background: var(--row-alt); }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75em;
      font-weight: bold;
      color: #fff;
    }
    .badge-proton { background: #7b2d8b; }
    .badge-native { background: #2d8b3a; }
    .badge-dosbox { background: #c67800; }
    .badge-retroarch { background: #c6006e; }
    .badge-wine { background: #2d5f8b; }
    .badge-pcsx2 { background: #1f6f9f; }
    .badge-custom { background: #5a6470; }
    .badge-unknown { background: #555; }
    .status-available { color: #5fd07a; }
    .status-partial { color: #d9a050; }
    .status-unavailable { color: #d96060; }
    .status-checking { color: var(--muted); }
    .cid-cell { font-family: var(--mono); font-size: 0.8em; word-break: break-all; }
    .cid-cell code {
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 3px;
      transition: background 0.15s, color 0.15s;
    }
    .cid-cell code:hover {
      background: var(--accent);
      color: #fff;
    }
    .mirror-count { font-weight: bold; }
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(0);
      background: var(--accent);
      color: #fff;
      padding: 0.5rem 1.2rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 1000;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <main>
    <h1>strom &mdash; IPFS game status</h1>
    <p>
      Availability of game assets on the IPFS network. Provider data fetched live via the
      <a href="https://specs.ipfs.tech/routing/http-routing-v1/">delegated routing API</a>.
      Game metadata is read live from the <a id="json-link" href=""><code></code></a>.
    </p>
    <p>
      <button id="check-all">Check all CIDs</button>
      <small id="progress"></small>
    </p>
    <table>
      <thead>
        <tr>
          <th>Game</th>
          <th>Runtime</th>
          <th>CIDs</th>
          <th>Providers</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="game-table"></tbody>
    </table>
  </main>


  <div class="toast" id="toast">Copied!</div>
  <script>
    "use strict";

    const toast = document.getElementById("toast");
    let toastTimer;
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        clearTimeout(toastTimer);
        toast.classList.add("show");
        toastTimer = setTimeout(() => toast.classList.remove("show"), 1500);
      });
    }

    // No seed hostname is baked in: served from a Radicle node's /raw route,
    // this page reads its own <rid> from the URL and queries that same node's
    // radicle-httpd API (same origin). Override with ?rid=RID and ?api=URL.
    const DEFAULT_RID =
      (location.pathname.match(/\/(rad:[^/]+)\//) || [])[1] ||
      "rad:zaCSBVa8UbKNEWBcmRTW1m9fZXhu";
    const DEFAULT_API = location.origin + "/api/v1";
    const ROUTING_ENDPOINTS = [
      "https://delegated-ipfs.dev/routing/v1/providers/",
      "https://cid.contact/routing/v1/providers/",
    ];
    const FETCH_TIMEOUT_MS = 10000;
    const MAX_PARALLEL = 10;
    const META_PARALLEL = 16;

    const params = new URLSearchParams(location.search);
    const RID = params.get("rid") || DEFAULT_RID;
    const API = (params.get("api") || DEFAULT_API).replace(/\/+$/, "");
    const jsonLink = document.getElementById("json-link");
    jsonLink.href = `${API}/repos/${RID}`;
    jsonLink.querySelector("code").textContent = `${RID} @ ${API}`;

    const table = document.getElementById("game-table");
    const progress = document.getElementById("progress");
    const checkAllBtn = document.getElementById("check-all");
    let games = {};
    let sortedNames = [];
    const results = {};
    window.results = results;

    function renderTable() {
      table.innerHTML = "";
      sortedNames = Object.keys(games).sort();
      for (const name of sortedNames) {
        const g = games[name];
        if (!g.cids || g.cids.length === 0) continue;

        const tr = document.createElement("tr");

        const tdName = document.createElement("td");
        const a = document.createElement("a");
        a.href = `https://lutris.net/games/${name}/`;
        a.textContent = name;
        tdName.appendChild(a);
        if (g.description) {
          const small = document.createElement("small");
          small.textContent = " - " + g.description;
          tdName.appendChild(document.createElement("br"));
          tdName.appendChild(small);
        }
        tr.appendChild(tdName);

        const tdRuntime = document.createElement("td");
        const badge = document.createElement("span");
        const runtime = g.runtime || "unknown";
        badge.className = "badge badge-" + runtime;
        badge.textContent = runtime;
        tdRuntime.appendChild(badge);
        tr.appendChild(tdRuntime);

        const tdCids = document.createElement("td");
        tdCids.className = "cid-cell";
        g.cids.forEach((cid, i) => {
          if (i > 0) tdCids.appendChild(document.createElement("br"));
          const code = document.createElement("code");
          code.textContent = cid.substring(0, 12) + "...";
          code.title = cid;
          code.addEventListener("click", () => copyToClipboard(cid));
          tdCids.appendChild(code);
        });
        tr.appendChild(tdCids);

        const tdMirrors = document.createElement("td");
        tdMirrors.id = "mirrors-" + name;
        tdMirrors.textContent = "-";
        tr.appendChild(tdMirrors);

        const tdStatus = document.createElement("td");
        tdStatus.id = "status-" + name;
        tdStatus.textContent = "-";
        tr.appendChild(tdStatus);

        table.appendChild(tr);
      }
    }

    async function queryEndpoint(endpoint, cid) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
      try {
        const resp = await fetch(endpoint + cid, {
          headers: { "Accept": "application/json" },
          signal: controller.signal,
          cache: "no-store",
        });
        clearTimeout(timer);
        if (!resp.ok) return [];
        const ct = (resp.headers.get("content-type") || "").toLowerCase();
        if (ct.includes("ndjson")) {
          const text = await resp.text();
          return text.trim().split("\n")
            .filter(l => l.trim())
            .map(l => { try { return JSON.parse(l); } catch (_) { return null; } })
            .filter(Boolean);
        }
        const data = await resp.json();
        return data.Providers || [];
      } catch (_) {
        clearTimeout(timer);
        return [];
      }
    }

    async function checkCid(cid) {
      const lists = await Promise.all(ROUTING_ENDPOINTS.map(ep => queryEndpoint(ep, cid)));
      const seen = new Set();
      for (const providers of lists) {
        for (const p of providers) {
          if (p && p.ID && !seen.has(p.ID)) seen.add(p.ID);
        }
      }
      return { available: seen.size > 0, providers: seen.size };
    }

    async function checkGame(name) {
      const g = games[name];
      const statusEl = document.getElementById("status-" + name);
      const mirrorsEl = document.getElementById("mirrors-" + name);
      if (!statusEl) return;

      statusEl.textContent = "checking...";
      statusEl.className = "status-checking";

      const perCid = [];
      for (const cid of g.cids) {
        perCid.push(await checkCid(cid));
      }

      mirrorsEl.innerHTML = "";
      perCid.forEach((r, i) => {
        if (i > 0) mirrorsEl.appendChild(document.createElement("br"));
        const span = document.createElement("span");
        span.className = "mirror-count";
        span.textContent = r.providers;
        mirrorsEl.appendChild(span);
      });

      const allAvailable = perCid.every(r => r.available);
      const anyAvailable = perCid.some(r => r.available);
      if (allAvailable) {
        statusEl.textContent = "available";
        statusEl.className = "status-available";
      } else if (anyAvailable) {
        statusEl.textContent = "partial";
        statusEl.className = "status-partial";
      } else {
        statusEl.textContent = "unavailable";
        statusEl.className = "status-unavailable";
      }

      results[name] = { perCid, allAvailable };
    }

    async function checkAll() {
      checkAllBtn.disabled = true;
      const queue = sortedNames.filter(n => games[n].cids && games[n].cids.length > 0);
      const total = queue.length;
      let done = 0;
      let idx = 0;

      async function worker() {
        while (idx < queue.length) {
          const name = queue[idx++];
          await checkGame(name);
          done++;
          progress.textContent = done + " / " + total;
        }
      }

      await Promise.all(
        Array.from({ length: Math.min(MAX_PARALLEL, total) }, () => worker())
      );
      checkAllBtn.disabled = false;
      progress.textContent = "done (" + total + " games)";
    }

    checkAllBtn.addEventListener("click", checkAll);

    async function pool(items, width, fn) {
      let i = 0;
      async function worker() {
        while (i < items.length) {
          await fn(items[i++]);
        }
      }
      await Promise.all(
        Array.from({ length: Math.min(width, items.length) }, () => worker())
      );
    }

    async function loadGames() {
      progress.textContent = "loading game list from Radicle...";
      const info = await (await fetch(`${API}/repos/${RID}`, { cache: "no-store" })).json();
      const head = info.payloads["xyz.radicle.project"].meta.head;
      const tree = await (
        await fetch(`${API}/repos/${RID}/tree/${head}/games`, { cache: "no-store" })
      ).json();
      const slugs = (tree.entries || [])
        .filter(e => e.kind === "tree")
        .map(e => e.name);
      games = {};
      let done = 0;
      await pool(slugs, META_PARALLEL, async (slug) => {
        try {
          const r = await fetch(
            `${API}/repos/${RID}/blob/${head}/games/${slug}/metadata.json`,
            { cache: "no-store" }
          );
          if (r.ok) {
            const md = JSON.parse((await r.json()).content);
            games[slug] = {
              cids: md.cids || [],
              description: md.description || null,
              runtime: md.runtime || "unknown",
            };
          }
        } catch (_) {
          /* skip games with no/invalid metadata.json */
        }
        progress.textContent = `loading metadata... ${++done} / ${slugs.length}`;
      });
      progress.textContent = `${Object.keys(games).length} games loaded`;
      renderTable();
    }

    loadGames().catch(err => {
      progress.textContent = "failed to load from Radicle: " + err.message;
    });
  </script>
</body>
</html>
