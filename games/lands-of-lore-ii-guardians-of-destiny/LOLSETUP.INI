; LOLSETUP.INI for Lands of Lore II: Guardians of Destiny.
;
; Normally written by the interactive InstallShield setup / LOLSETUP.EXE.
; Our build copies the uncompressed disc tree directly and never runs that
; setup, so the file is absent and LOLG95.EXE aborts at startup with
; "Missing file lolsetup.ini from installed directory".
;
; What the engine actually reads (verified by Ghidra-decompiling the only
; function in LOLG95.EXE that references the "lolsetup.ini" string,
; FUN_00504cd0):
;   1. an existence check (else error 0x19 -> the "Missing file" dialog),
;   2. [Swap] Swap_Size  (GetPrivateProfileInt, default 0x6400000 = 100 MB),
;   3. [Video] Default   (GetPrivateProfileInt, default 400; ==480 toggles a
;                         vertical-resolution flag).
; No sound-device keys are read from this file by LOLG95.EXE (digital/MIDI
; selection lives in OPTIONS.INI and the Miles/DirectSound path), so the
; [MIDI]/[Digital] blocks below only mirror what LOLSETUP.EXE would emit;
; they are inert for startup but keep the file shaped like a real one.

[Swap]
; Swap-file size in bytes. 100 MB matches the engine's own built-in default
; (0x6400000) and the community-recommended range (50-150 MB).
Swap_Size=104857600

[Video]
; Default vertical resolution. 400 is the engine's built-in default (640x400);
; 480 would request 640x480. Keep the conservative built-in value.
Default=400

[Digital]
DeviceName=DirectSound
DeviceDriver=0
DeviceID=0x0000
DevicePort=0x0000

[MIDI]
DeviceName=MPU-401
DeviceDriver=56
DeviceID=0xa001
DevicePort=0x330
